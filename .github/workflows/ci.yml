name: CI
permissions:
  contents: read

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/feelings_test
      # Журнал сервера — в смонтированный каталог: тесты «пароль не попал в журнал»
      # (test_login_roles_a8.py, test_owner_migrations.py) выполняются, а не пропускаются
      # (ревью 0.8, MINOR-5). Сервисный контейнер Actions не принимает аргументы postgres —
      # поэтому сервер запускается шагом docker run.
      A8_SERVER_LOG: ${{ github.workspace }}/.pglog/postgresql.log
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      # Версия pgvector закреплена — та же, что на стенде (infra/deploy/docker-compose.prod.yml),
      # чтобы проверки прав функций vector шли на одной версии расширения (ревью 0.8, MINOR-11).
      - name: PostgreSQL 16 + pgvector 0.8.0
        run: |
          mkdir -p .pglog && chmod 777 .pglog
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=feelings_test \
            -v "$PWD/.pglog:/pglog" \
            pgvector/pgvector:0.8.0-pg16 \
            -c logging_collector=on -c log_directory=/pglog -c log_filename=postgresql.log \
            -c log_file_mode=0644 -c log_rotation_size=0
          for i in $(seq 1 60); do
            docker exec pg pg_isready -U postgres -d feelings_test -h 127.0.0.1 && break
            sleep 2
          done
          docker exec pg pg_isready -U postgres -d feelings_test -h 127.0.0.1
          test -r "$A8_SERVER_LOG"
      # test_login_roles.py запускает infra/db/roles.sql настоящим psql (нужен ≥ 15, \getenv).
      - run: psql --version
      - run: make backend-lint
      # ТЗ §9.2 п.4 (задача 4.3): изоляция агентов и устойчивость к инструкциям — отдельной
      # строкой сборки, на каждый PR и push в main. Красный, если собрано меньше N тестов набора
      # (N — tests/_isolation_set.py, ISOLATION_MIN), 0 собранных (код pytest 5) или хоть один
      # пропущен (skip: «нет БД» ≠ зелёный). Перечень тестов — tests/_isolation_set.py.
      - name: Isolation release set (pytest -m isolation)
        run: cd backend && uv run --locked pytest -m isolation -q --isolation-min=349
      - run: make backend-test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci
      - run: make frontend-lint
      - run: make frontend-test
      - run: cd frontend && npm run build
