[project]
name = "feelings-ai-backend"
version = "0.1.0"
description = "«Чувства AI» — сервер"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pgvector>=0.3.6",
  "redis>=5.2",
  "cryptography>=43",
  "pyjwt>=2.9",
  "tzdata>=2025.2",
  "httpx>=0.28",
  "anthropic>=2.12.0",
  "pypdf>=5.1",
  "defusedxml>=0.7.1",
  "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
  "psycopg[binary]>=3.2",
  "openapi-spec-validator>=0.9.0",
  "pyyaml>=6.0.4",
  "jsonschema>=4.26.0",
  "types-pyyaml>=6.0.12.20261113",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "isolation: набор выпуска 4.3 — изоляция агентов и устойчивость к инструкциям (ТЗ §9.2 п.4); перечень — tests/_isolation_set.py",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608", "E501"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "asyncpg.*", "defusedxml.*"]
ignore_missing_imports = true
