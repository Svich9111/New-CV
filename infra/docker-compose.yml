# Локальная разработка: PostgreSQL 16 + pgvector и Redis; по профилю `workers` — миграции,
# роли входа и фоновые воркеры памяти, базы знаний, конвейера и уведомлений (Б-69). Продуктив — задача 4.7.
# Порты привязаны к 127.0.0.1 — БД и Redis не публикуются наружу (справка по инфраструктуре, раздел 5);
# у миграций, ролей и воркеров портов нет совсем.
#
#   make db-up     — только postgres и redis (как раньше);
#   make dev-up    — всё, включая воркеры: postgres → migrate → db-roles → worker-memory, worker-kb,
#                    worker-pipeline, worker-notify.
#
# Значения ${…} подставляются из корневого .env (`--env-file .env` в Makefile); пароли ролей
# входа — FEELINGS_*_DB_PASSWORD (см. .env.example, docs/ADMIN.md). Пустой пароль — db-roles
# останавливается с ошибкой, воркеры не запускаются.
x-backend: &backend
  profiles: ["workers"]
  build:
    context: ..
    dockerfile: infra/backend.Dockerfile
  image: feelings-backend:dev
  env_file:
    - path: ../.env
      required: false
  # Ошибка настройки (нет ключей, OPENROUTER_API_KEY, набор промптов) — выход с кодом 78
  # (EX_CONFIG, Б-90): не больше 5 перезапусков, затем контейнер остаётся Exited (78) — причина в
  # docker compose logs <воркер>. Временная недоступность OpenRouter при старте — повтор в процессе
  # без выхода (контейнер Up, unhealthy). Стенд — unless-stopped (deploy/docker-compose.prod.yml).
  restart: "on-failure:5"

# Живость воркера — пульс (Б-85, app.workers.health): метка последнего успешного прохода цикла;
# unhealthy — пульс старше --max-age, пауза из-за ошибки настройки или ожидание при старте.
x-worker-health: &worker-health
  test: ["CMD", "python", "-m", "app.workers.health", "--max-age", "120"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

x-worker-health-fast: &worker-health-fast
  <<: *worker-health
  test: ["CMD", "python", "-m", "app.workers.health", "--max-age", "60"]

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: feelings
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]

  # Схема БД под владельцем (локальная БД разработчика — АР-4). Создаёт и групповые роли feelings_*.
  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      FEELINGS_ENV: dev
      FEELINGS_MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/feelings
    depends_on:
      postgres: { condition: service_healthy }

  # Роли входа воркера, администратора и API (infra/db/roles.sql) — после миграций: групповые
  # роли feelings_* создаёт миграция 0001. Повторный запуск безопасен (пароли обновляются).
  db-roles:
    profiles: ["workers"]
    image: pgvector/pgvector:0.8.0-pg16
    restart: "no"
    entrypoint: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-f", "/db/roles.sql"]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: feelings
      FEELINGS_WORKER_DB_PASSWORD: ${FEELINGS_WORKER_DB_PASSWORD:-}
      FEELINGS_ADMIN_DB_PASSWORD: ${FEELINGS_ADMIN_DB_PASSWORD:-}
      FEELINGS_API_DB_PASSWORD: ${FEELINGS_API_DB_PASSWORD:-}
    volumes:
      - ./db:/db:ro
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Воркер памяти (2.4): обязателен вместе с DELETE /memory (Б-73, docs/ADMIN.md).
  worker-memory:
    <<: *backend
    command: ["python", "-m", "app.workers.memory"]
    environment: &worker-env
      FEELINGS_ENV: dev
      FEELINGS_WORKER_DATABASE_URL: postgresql+asyncpg://feelings_worker_login:${FEELINGS_WORKER_DB_PASSWORD:-}@postgres:5432/feelings
      FEELINGS_REDIS_URL: redis://redis:6379/0
    healthcheck: *worker-health
    depends_on: &worker-deps
      db-roles: { condition: service_completed_successfully }
      redis: { condition: service_started }

  # Воркер индексации базы знаний (2.6).
  worker-kb:
    <<: *backend
    command: ["python", "-m", "app.workers.kb"]
    environment: *worker-env
    healthcheck: *worker-health
    depends_on: *worker-deps

  # Воркер конвейера входящего (3.2): отправленные сообщения → безопасность, тон, адаптация →
  # доставка. Нужны ключи шифрования и OPENROUTER_API_KEY из .env.
  worker-pipeline:
    <<: *backend
    command: ["python", "-m", "app.workers.pipeline"]
    environment:
      <<: *worker-env
      # Набор промптов (АР-45): локально — прототип v0; в production — только прогнанный набор.
      FEELINGS_PIPELINE_PROMPT_SET: ${FEELINGS_PIPELINE_PROMPT_SET:-v0}
    # Б-88: начатые сообщения дорабатываются до записи исхода — срок не меньше аренды (180 с).
    stop_grace_period: 200s
    healthcheck: *worker-health-fast
    depends_on: *worker-deps

  # Воркер уведомлений (3.5): доставленные сообщения → уведомление получателю в Telegram без
  # текста сообщения. Нужен FEELINGS_TELEGRAM_BOT_TOKEN из .env (без него не стартует);
  # FEELINGS_WEBAPP_URL (https) — кнопка «Открыть» Mini App, без него уведомление без кнопки.
  worker-notify:
    <<: *backend
    command: ["python", "-m", "app.workers.notify"]
    environment: *worker-env
    # SIGTERM → начатый запрос к Bot API дорабатывается и отмечается (как на стенде, MAJOR-1).
    stop_grace_period: 30s
    # Живость — пульс (как на стенде): пауза из-за неверного токена (401/404) — unhealthy.
    healthcheck: *worker-health-fast
    depends_on: *worker-deps

volumes:
  pgdata:
