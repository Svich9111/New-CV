# Тестовый стенд «Чувства AI» (задача 0.8; НЕ production, FEELINGS_ENV=staging). Один сервер
# в РФ (152-ФЗ, Д1), Docker Compose. Порядок и команды — docs/DEPLOY.md.
#
# Секреты:
#   - infra/deploy/.env (600) — секреты приложения и пароли ролей входа; compose читает его сам
#     (лежит рядом) и раздаёт каждому сервису только нужные ему значения;
#   - infra/deploy/secrets/postgres_superuser_password (600) — пароль суперпользователя БД,
#     отдельно от .env (docker secret, файл /run/secrets/…; в контейнеры приложения не
#     попадает). Пароль из файла задаётся только при первом создании тома и нужен db-init; сам
#     файл entrypoint образа postgres читает при КАЖДОМ старте — он обязан существовать
#     (после db-init допустима пустая заглушка 600, docs/DEPLOY.md §4). Внутри контейнера
#     postgres суперпользователь входит по локальному сокету без пароля (на этом построены
#     backup.sh и restore-check.sh): доступ к Docker и так равен доступу суперпользователя —
#     группа docker равносильна root (bootstrap.sh).
# В этом файле нет ни одного значения секрета: обязательные переменные — `:?`.
#
# Наружу — только Caddy: 80 (сертификат, переадресация) и 443 (HTTPS, HTTP/3). БД и Redis —
# только во внутренней сети `data` без выхода наружу; портов у них нет.
#
#   dc = docker compose -f infra/deploy/docker-compose.prod.yml
#   dc --profile ops run --rm db-init     — однократно: владелец схемы и расширение vector
#   dc --profile ops run --rm migrate     — миграции под feelings_owner (ТОЛЬКО по подтверждению, RoadMap §4)
#   dc --profile ops run --rm db-roles    — роли входа (infra/db/roles.sql) под feelings_owner
#   dc up -d                              — сервисы
#
# `dc config` и `docker inspect` показывают значения из .env — вывод не прикладывать к тикетам.
name: feelings

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  logging: *logging

# Образ сервера (API, воркеры, миграции): непривилегированный пользователь `feelings` (uid 10001).
# FEELINGS_ENV на стенде — только staging или production (ревью 0.8, MINOR-8): dev/local/test
# разрешают опрос бота (он удаляет вебхук) и ослабляют проверки. Значение compose проверить не
# умеет, поэтому проверяет точка входа: иначе контейнер завершается с кодом 64 до запуска
# процесса, а `dc up -d` сообщает о сбое (caddy ждёт healthy api). Команда сервиса — в "$@".
x-backend: &backend
  <<: *hardening
  image: feelings-backend:${FEELINGS_IMAGE_TAG:?задайте FEELINGS_IMAGE_TAG}
  build:
    context: ../..
    dockerfile: infra/backend.Dockerfile
  entrypoint:
    - /bin/sh
    - -c
    - 'case "$$FEELINGS_ENV" in staging|production) exec "$$@" ;; esac; echo "FEELINGS_ENV=$$FEELINGS_ENV: на стенде допустимы только staging и production (docs/DEPLOY.md §12)" >&2; exit 64'
    - env-guard
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: ["ALL"]
  restart: unless-stopped

# Перезапуск воркеров (тест 0.8, A8-0.8-D3; Б-90): unless-stopped, а не on-failure:N. Коды выхода
# воркера (app.workers.startup):
#   78 (EX_CONFIG) — ошибка настройки (нет/неверная переменная, ключи, набор промптов, модель
#        отклонила ключ, БД отвергла роль входа): CRITICAL-строка с именем переменной, без значений;
#        `dc ps` — Restarting (78). Перезапуск не поможет — правка .env и `dc up -d <воркер>`;
#   0  — штатная остановка (SIGTERM); прочие — непредвиденный сбой (перезапуск нужен).
# Временная недоступность при старте (OpenRouter, сеть/DNS) — повтор в процессе, без выхода:
# контейнер Up (unhealthy), пульс `waiting`. Docker не умеет не перезапускать по коду выхода, а
# счётчик on-failure:N не сбрасывается — редкие сбои за месяцы оставили бы воркер остановленным.
# Поэтому unless-stopped: ошибка настройки повторяется с растущей паузой Docker (до 1 минуты) и
# видна по коду 78 — DEPLOY §4.
x-worker-restart: &worker-restart unless-stopped

# Живость воркера — пульс (Б-85, app.workers.health): метка последнего успешного прохода цикла в
# /tmp (tmpfs контейнера). Unhealthy: пульс старше --max-age (цикл завис, БД недоступна), пауза из-за
# ошибки настройки (модель, токен бота) или ожидание при старте. В файле — время, состояние и вид
# причины; ни текстов, ни id. Память и БЗ проходят цикл раз в 30 с — запас 120 с.
x-worker-health: &worker-health
  test: ["CMD", "python", "-m", "app.workers.health", "--max-age", "120"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

# Конвейер и уведомления проходят цикл каждую секунду — пульс старше 60 с уже сбой.
x-worker-health-fast: &worker-health-fast
  <<: *worker-health
  test: ["CMD", "python", "-m", "app.workers.health", "--max-age", "60"]

# Подключения собираются здесь из паролей ролей (адреса — внутренняя сеть compose).
x-urls:
  api-db: &api-db postgresql+asyncpg://feelings_api:${FEELINGS_API_DB_PASSWORD:?задайте FEELINGS_API_DB_PASSWORD}@postgres:5432/feelings
  worker-db: &worker-db postgresql+asyncpg://feelings_worker_login:${FEELINGS_WORKER_DB_PASSWORD:?задайте FEELINGS_WORKER_DB_PASSWORD}@postgres:5432/feelings
  admin-db: &admin-db postgresql+asyncpg://feelings_admin_login:${FEELINGS_ADMIN_DB_PASSWORD:?задайте FEELINGS_ADMIN_DB_PASSWORD}@postgres:5432/feelings
  owner-db: &owner-db postgresql+asyncpg://feelings_owner:${FEELINGS_OWNER_DB_PASSWORD:?задайте FEELINGS_OWNER_DB_PASSWORD}@postgres:5432/feelings

secrets:
  postgres_superuser_password:
    # Каталог можно переопределить (локальная проверка во временном каталоге).
    file: ${FEELINGS_SECRETS_DIR:-./secrets}/postgres_superuser_password

services:
  caddy:
    <<: *hardening
    image: feelings-caddy:${FEELINGS_IMAGE_TAG}
    build:
      context: ../..
      dockerfile: infra/deploy/caddy.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      FEELINGS_DOMAIN: ${FEELINGS_DOMAIN:?задайте FEELINGS_DOMAIN}
      # Почта для Let's Encrypt; `internal` — собственный центр Caddy (только локальная проверка).
      FEELINGS_TLS: ${FEELINGS_TLS:?задайте FEELINGS_TLS (почта для Let's Encrypt)}
      FEELINGS_PROXY_MAX_BODY: ${FEELINGS_PROXY_MAX_BODY:-2MiB}
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # Админ-интерфейс Caddy слушает только 127.0.0.1:2019 внутри контейнера.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [edge]
    depends_on:
      api: { condition: service_healthy }

  # Один процесс uvicorn: защита от повторной доставки обновлений бота (update_id) и фоновые
  # задачи чата/памяти живут в памяти процесса — несколько процессов API пока не поддержаны.
  api:
    <<: *backend
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --proxy-headers
      # Порт API не опубликован: доверять заголовкам X-Forwarded-* можно (до API доходит только Caddy).
      - --forwarded-allow-ips=*
      - --no-server-header
      - --timeout-graceful-shutdown=20
    environment:
      FEELINGS_ENV: ${FEELINGS_ENV:?задайте FEELINGS_ENV}
      FEELINGS_DATABASE_URL: *api-db
      FEELINGS_ADMIN_DATABASE_URL: *admin-db
      FEELINGS_REDIS_URL: redis://redis:6379/0
      FEELINGS_TELEGRAM_BOT_TOKEN: ${FEELINGS_TELEGRAM_BOT_TOKEN:?задайте FEELINGS_TELEGRAM_BOT_TOKEN}
      FEELINGS_SESSION_SECRET: ${FEELINGS_SESSION_SECRET:?задайте FEELINGS_SESSION_SECRET}
      FEELINGS_BOT_USERNAME: ${FEELINGS_BOT_USERNAME:?задайте FEELINGS_BOT_USERNAME}
      FEELINGS_TELEGRAM_WEBHOOK_SECRET: ${FEELINGS_TELEGRAM_WEBHOOK_SECRET:?задайте FEELINGS_TELEGRAM_WEBHOOK_SECRET}
      FEELINGS_WEBAPP_URL: https://${FEELINGS_DOMAIN}/
      FEELINGS_ENCRYPTION_KEYS: ${FEELINGS_ENCRYPTION_KEYS:?задайте FEELINGS_ENCRYPTION_KEYS}
      FEELINGS_ENCRYPTION_KEY_ID: ${FEELINGS_ENCRYPTION_KEY_ID:?задайте FEELINGS_ENCRYPTION_KEY_ID}
      FEELINGS_LLM_WRITER_MODEL: ${FEELINGS_LLM_WRITER_MODEL:-anthropic/claude-sonnet-5.5}
      FEELINGS_LLM_CLASSIFIER_MODEL: ${FEELINGS_LLM_CLASSIFIER_MODEL:-anthropic/claude-haiku-5.5}
      # Обязателен: без него воркер памяти не стартует, ответы агента — ошибка (DEPLOY §0).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?задайте OPENROUTER_API_KEY}
      FEELINGS_ADMIN_TOKEN_SHA256: ${FEELINGS_ADMIN_TOKEN_SHA256:-}
      FEELINGS_CHAT_DAILY_LIMIT: ${FEELINGS_CHAT_DAILY_LIMIT:-100}
      FEELINGS_MAX_REQUEST_BODY_BYTES: ${FEELINGS_MAX_REQUEST_BODY_BYTES:-1048576}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    # data — БД и Redis; edge — Caddy и выход наружу (Telegram Bot API, OpenRouter).
    networks: [data, edge]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Воркер памяти (2.4) — обязателен вместе с API (docs/ADMIN.md §5).
  worker-memory:
    <<: *backend
    command: ["python", "-m", "app.workers.memory"]
    restart: *worker-restart
    environment:
      FEELINGS_ENV: ${FEELINGS_ENV}
      FEELINGS_WORKER_DATABASE_URL: *worker-db
      FEELINGS_ENCRYPTION_KEYS: ${FEELINGS_ENCRYPTION_KEYS}
      FEELINGS_ENCRYPTION_KEY_ID: ${FEELINGS_ENCRYPTION_KEY_ID}
      FEELINGS_MEMORY_FINGERPRINT_KEY: ${FEELINGS_MEMORY_FINGERPRINT_KEY:?задайте FEELINGS_MEMORY_FINGERPRINT_KEY}
      FEELINGS_MEMORY_FINGERPRINT_KEYS_OLD: ${FEELINGS_MEMORY_FINGERPRINT_KEYS_OLD:-}
      FEELINGS_LLM_WRITER_MODEL: ${FEELINGS_LLM_WRITER_MODEL:-anthropic/claude-sonnet-5.5}
      FEELINGS_LLM_CLASSIFIER_MODEL: ${FEELINGS_LLM_CLASSIFIER_MODEL:-anthropic/claude-haiku-5.5}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?задайте OPENROUTER_API_KEY}
    healthcheck: *worker-health
    networks: [data, egress]
    depends_on:
      postgres: { condition: service_healthy }

  # Воркер индексации базы знаний (2.6).
  worker-kb:
    <<: *backend
    command: ["python", "-m", "app.workers.kb"]
    restart: *worker-restart
    environment:
      FEELINGS_ENV: ${FEELINGS_ENV}
      FEELINGS_WORKER_DATABASE_URL: *worker-db
      FEELINGS_LLM_WRITER_MODEL: ${FEELINGS_LLM_WRITER_MODEL:-anthropic/claude-sonnet-5.5}
      FEELINGS_LLM_CLASSIFIER_MODEL: ${FEELINGS_LLM_CLASSIFIER_MODEL:-anthropic/claude-haiku-5.5}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?задайте OPENROUTER_API_KEY}
    healthcheck: *worker-health
    networks: [data, egress]
    depends_on:
      postgres: { condition: service_healthy }

  # Воркер конвейера входящего (3.2): без него отправленные сообщения остаются «в обработке».
  worker-pipeline:
    <<: *backend
    command: ["python", "-m", "app.workers.pipeline"]
    restart: *worker-restart
    environment:
      FEELINGS_ENV: ${FEELINGS_ENV}
      FEELINGS_WORKER_DATABASE_URL: *worker-db
      FEELINGS_ENCRYPTION_KEYS: ${FEELINGS_ENCRYPTION_KEYS}
      FEELINGS_ENCRYPTION_KEY_ID: ${FEELINGS_ENCRYPTION_KEY_ID}
      FEELINGS_LLM_WRITER_MODEL: ${FEELINGS_LLM_WRITER_MODEL:-anthropic/claude-sonnet-5.5}
      FEELINGS_LLM_CLASSIFIER_MODEL: ${FEELINGS_LLM_CLASSIFIER_MODEL:-anthropic/claude-haiku-5.5}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?задайте OPENROUTER_API_KEY}
      # Набор промптов конвейера (АР-26, АР-45): v0 — только staging; без значения не стартует.
      FEELINGS_PIPELINE_PROMPT_SET: ${FEELINGS_PIPELINE_PROMPT_SET:?задайте FEELINGS_PIPELINE_PROMPT_SET (АР-45)}
    # Б-88: SIGTERM → начатые сообщения дорабатываются до записи исхода. Каждое ограничено тайм-аутом
    # конвейера (аренда − 30 с) и окном записи (аренда − 15 с от захвата); аренда по умолчанию 180 с
    # (FEELINGS_PIPELINE_LEASE_S) — срок не меньше аренды с запасом. Меняете аренду — меняйте и срок.
    stop_grace_period: 200s
    healthcheck: *worker-health-fast
    networks: [data, egress]
    depends_on:
      postgres: { condition: service_healthy }

  # Воркер уведомлений (3.5): доставленные сообщения → уведомление получателю через бота (без
  # текста сообщения). Только токен бота и роль воркера: ключей шифрования и OpenRouter нет.
  worker-notify:
    <<: *backend
    command: ["python", "-m", "app.workers.notify"]
    restart: *worker-restart
    # SIGTERM → начатый запрос к Bot API (тайм-аут клиента до 10 с + соединение 5 с) дорабатывается
    # и отмечается; по умолчанию Docker ждёт 10 с и убивает — отправленное, но не отмеченное
    # уведомление ушло бы повторно (3.5, MAJOR-1).
    stop_grace_period: 30s
    environment:
      FEELINGS_ENV: ${FEELINGS_ENV}
      FEELINGS_WORKER_DATABASE_URL: *worker-db
      FEELINGS_TELEGRAM_BOT_TOKEN: ${FEELINGS_TELEGRAM_BOT_TOKEN:?задайте FEELINGS_TELEGRAM_BOT_TOKEN}
      FEELINGS_WEBAPP_URL: https://${FEELINGS_DOMAIN}/
    healthcheck: *worker-health-fast
    networks: [data, egress]
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Пароль задаётся только при первом создании тома; файл читается при каждом старте
      # (должен существовать — после db-init допустима пустая заглушка 600).
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      POSTGRES_DB: feelings
    secrets: [postgres_superuser_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d feelings"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [data]

  redis:
    image: redis:7.4-alpine
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    restart: unless-stopped
    # Только счётчики лимитов: без записи на диск.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [data]

  # --- Разовые операции (профиль ops), только по команде оператора ----------------------
  # Однократно, суперпользователем: владелец схемы feelings_owner и расширение vector
  # (infra/db/init-owner.sql). Повторный запуск безопасен (смена пароля владельца).
  db-init:
    image: pgvector/pgvector:0.8.0-pg16
    profiles: ["ops"]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    restart: "no"
    entrypoint:
      - sh
      - -c
      - 'PGPASSWORD="$$(cat /run/secrets/postgres_superuser_password)" exec psql -X -v ON_ERROR_STOP=1 -f /db/init-owner.sql'
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: feelings
      FEELINGS_OWNER_DB_PASSWORD: ${FEELINGS_OWNER_DB_PASSWORD:?задайте FEELINGS_OWNER_DB_PASSWORD}
    secrets: [postgres_superuser_password]
    volumes:
      - ../db:/db:ro
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }

  # Миграции под владельцем схемы (не суперпользователем). ТОЛЬКО по подтверждению оператора.
  migrate:
    <<: *backend
    profiles: ["ops"]
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      FEELINGS_ENV: ${FEELINGS_ENV}
      FEELINGS_MIGRATION_DATABASE_URL: *owner-db
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }

  # Роли входа (infra/db/roles.sql) — после миграций, под feelings_owner (CREATEROLE и ADMIN на
  # созданные им групповые роли); повторный запуск = смена паролей.
  db-roles:
    image: pgvector/pgvector:0.8.0-pg16
    profiles: ["ops"]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    restart: "no"
    entrypoint: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-f", "/db/roles.sql"]
    environment:
      PGHOST: postgres
      PGUSER: feelings_owner
      PGPASSWORD: ${FEELINGS_OWNER_DB_PASSWORD}
      PGDATABASE: feelings
      FEELINGS_WORKER_DB_PASSWORD: ${FEELINGS_WORKER_DB_PASSWORD}
      FEELINGS_ADMIN_DB_PASSWORD: ${FEELINGS_ADMIN_DB_PASSWORD}
      FEELINGS_API_DB_PASSWORD: ${FEELINGS_API_DB_PASSWORD}
    volumes:
      - ../db:/db:ro
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }

networks:
  # Внутренняя: без выхода наружу и без опубликованных портов.
  data:
    internal: true
  edge: {}
  egress: {}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
