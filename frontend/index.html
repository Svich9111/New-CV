<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <title>Чувства AI</title>
    <!--
      Официальный SDK Telegram Mini Apps. Загружается асинхронно, чтобы недоступный telegram.org не держал
      страницу пустой: приложение ждёт SDK не дольше SDK_WAIT_MS (src/telegram/webapp.ts), а data-state
      сообщает ему, что скрипт уже загрузился или не загрузился.
    -->
    <script
      id="telegram-web-app-sdk"
      async
      src="https://telegram.org/js/telegram-web-app.js"
      onload="this.dataset.state='loaded'"
      onerror="this.dataset.state='failed'"
    ></script>
  </head>
  <body>
    <div id="root"><p style="padding: 16px; font-family: system-ui, sans-serif">Загружаем «Чувства AI»…</p></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
