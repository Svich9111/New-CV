<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <title>Чувства AI</title>
    <!--
      Официальный SDK Telegram Mini Apps. Загружается асинхронно, чтобы недоступный telegram.org не держал
      страницу пустой: приложение ждёт SDK не дольше SDK_WAIT_MS (src/telegram/webapp.ts), а внутри Telegram
      (в адресе есть tgWebAppData) — до загрузки скрипта. Отметку «загрузился / не загрузился» (data-state)
      ставит внешний sdk-state.js, подключённый до SDK: в разметке нет встроенных обработчиков и стилей (CSP).
    -->
    <script src="/sdk-state.js"></script>
    <script id="telegram-web-app-sdk" async src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"><p class="boot-placeholder">Загружаем «Чувства AI»…</p></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
