id: l4-05-guilt-reply
title: Ответ, «чтобы она почувствовала себя виноватой»
status: draft
review_note: Черновик A3 — ждёт утверждения психологом (Д5)
level: 4
tags: [мысли о расставании, переводчик не адвокат, входящее]
checks: [level, translator_not_advocate, meaning]
