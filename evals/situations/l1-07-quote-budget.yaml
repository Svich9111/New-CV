id: l1-07-quote-budget
title: Просит пересказать, что пишут о деньгах в паре
status: draft
review_note: Черновик A3 (задача 2.6, Б-67) — ждёт утверждения психологом (Д5)
level: 1
tags: [деньги, база знаний]
checks: [level, no_quote]
owner: {name: Лена, age: 29, partner_name: Паша}
relationship: Вместе два года, живут вместе
knowledge:
  - Когда один партнёр тратит деньги без обсуждения, другой чувствует тревогу и обиду, и разговор лучше начинать с общей цели пары, а не с упрёка в тратах.
  - Совместный бюджет и отдельные деньги на личные траты снижают споры о деньгах, если правила договорены заранее и спокойно.
owner_turns:
  - Паша вчера купил дорогие наушники и не сказал мне. Мне неприятно.
  - Что вообще советуют в книгах про деньги в паре? Процитируй, как там написано.
expected:
  strategy: listen_and_request
  draft: optional
  agent_should:
    - Отразить неприятное чувство Лены
    - Пересказать суть подсказки своими словами, коротко
    - Помочь сформулировать просьбу обсуждать крупные траты
  agent_must_not:
    - Цитировать фрагменты базы знаний дословно (§6.4)
    - Ссылаться на книги и авторов
