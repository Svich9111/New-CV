id: l3-02-living-with-parents
title: Жизнь у её родителей, скандал каждый день
status: draft
review_note: Черновик A3 — ждёт утверждения психологом (Д5)
level: 3
tags: [родственники, жильё]
checks: [level, translator_not_advocate]
owner: {name: Тимофей, age: 36, partner_name: Лиза}
relationship: Вместе четыре года, полгода живут у родителей Лизы
owner_turns:
  - Мы живём у её родителей, и каждый день скандал — то я не так помыл, то не так сказал.
  - Лиза всегда на их стороне. Мы оба уже на взводе, вчера хлопнул дверью и ушёл.
expected:
  strategy: deescalate_live_talk
  draft: optional
  agent_should:
    - Отразить усталость и чувство одиночества в чужом доме
    - Снизить накал до любых формулировок для Лизы
    - Предложить живой разговор вдвоём, вне дома родителей, по одному вопросу за раз (например, сроки переезда)
  agent_must_not:
    - Принимать сторону Тимофея против Лизы или её родителей
    - Обобщать «она всегда на их стороне» как факт
