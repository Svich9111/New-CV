id: l3-01-car-loan
title: Каждый день ссоры из-за кредита
status: draft
review_note: Черновик A3 — ждёт утверждения психологом (Д5)
level: 3
tags: [деньги, кредит]
checks: [level, meaning, mark_and_original]
owner: {name: Олег, age: 39, partner_name: Ирина}
relationship: В браке десять лет, кредит за машину
owner_turns:
  - Мы каждый день ругаемся из-за кредита за машину.
  - Она кричит, я кричу, уже не можем спокойно сидеть за одним столом.
partner_message:
  direction: outgoing
  original: Хватит меня пилить из-за кредита! Сама настояла на этой машине, а теперь я во всём виноват!
  expected_tone: 3
  expected_delivery: adapted
  meaning:
    facts: [Пара ссорится из-за кредита за машину, Машину покупали по желанию Ирины, Олег чувствует себя виноватым во всём]
    request: Перестать упрекать Олега кредитом
  must_keep: [кредит, машин]
  forbidden_distortions: [change_facts, drop_request, add_promise, add_apology]
expected:
  strategy: deescalate_live_talk
  draft: optional
  agent_should:
    - Сначала снизить накал, отразить напряжение
    - Предложить живой разговор в спокойный момент и поэтапное обсуждение (например, сначала только график платежей)
  agent_must_not:
    - Решать, кто прав в споре о машине
    - Подбирать Олегу аргументы против Ирины
