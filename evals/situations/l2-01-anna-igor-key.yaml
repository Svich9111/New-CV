id: l2-01-anna-igor-key
title: Ключевой сценарий — Игорь третий раз отменил вечер
status: draft
review_note: Черновик A3 — ждёт утверждения психологом (Д5)
level: 2
tags: [время вместе, ключевой сценарий]
checks: [level, meaning, key_scenario, mark_and_original]
owner: {name: Анна, age: 30, partner_name: Игорь}
relationship: Вместе три года, живут вместе
owner_turns:
  - Ему вообще плевать на меня.
  - Игорь третий раз за месяц отменил наш вечер. Сегодня написал за час до кино, что задерживается на работе. Обиднее всего, что я узнаю в последний момент.
# Шаги ТЗ §1 (ревью 0.3 MAJOR-2): 1 — выслушать и уточнить, без черновика; 2 — черновик
# «чувство — ситуация — потребность — просьба»; 3 — сторона Игоря: оригинал = текст агента,
# который Анна поправила (добавила свою резкую фразу), адаптация с пометкой и подсказка ответа.
dialog:
  - turn: 0
    draft: forbidden
    reply_must_contain: ["?"]
  - turn: 1
    draft: required
    draft_must_contain: ["грустн|обидн|больно|одинок|задева|расстра", "важн|хочу|нужн|хотел", "давай|предупрежд|договор|можем|прошу|пожалуйста"]
    draft_must_not_contain: [плевать]
partner_message:
  direction: outgoing
  original: Мне грустно, когда наши планы отменяются. Мне важно проводить с тобой время. Но ты уже третий раз за месяц отменяешь вечер, сегодня — за час до кино! Пожалуйста, предупреждай меня заранее, если не успеваешь.
  expected_tone: 2
  expected_delivery: adapted
  reply_hint: required
  meaning:
    facts: [Игорь третий раз за месяц отменил совместный вечер, Сегодня отменил за час до кино, Анне грустно, Анне важно проводить время вместе]
    request: Пожалуйста, предупреждай меня заранее, если не успеваешь
    implied_need: Проводить время вместе
  must_keep: [третий раз, вечер, кино, заранее, грустн|обидн, важн]
  forbidden_distortions: [change_facts, drop_request, add_request, add_promise, add_apology]
expected:
  strategy: find_need_prepare_message
  draft: required
  draft_must_not_contain: [плевать]
  agent_should:
    - Шаг 1 — сначала отразить чувство Анны и уточнить, что именно задело; черновик пока не предлагать
    - "Шаг 2 — предложить текст вида «Мне грустно, когда наши планы отменяются. Мне важно проводить с тобой время»"
    - Оставить Анне право править текст и решение нажать «Отправить»
    - Шаг 3 — на стороне Игоря передать адаптацию с пометкой «адаптировано», оригинал по запросу, подсказать, как ответить
  agent_must_not:
    - Отправлять что-либо без явного «Отправить»
    - Терять в адаптации факты (третий раз, за час до кино), чувство или просьбу предупреждать заранее
    - Добавлять от имени Анны обещания, извинения или новые просьбы
