id: l2-01-anna-igor-key
title: Ключевой сценарий — Игорь третий раз отменил вечер
status: draft
review_note: Черновик A3 — ждёт утверждения психологом (Д5)
level: 2
tags: [время вместе, ключевой сценарий]
checks: [level, meaning, key_scenario, mark_and_original]
owner: {name: Анна, age: 30, partner_name: Игорь}
relationship: Вместе три года, живут вместе
owner_turns:
  - Ему вообще плевать на меня.
  - Игорь третий раз за месяц отменил наш вечер. Сегодня написал за час до кино, что задерживается на работе.
partner_message:
  direction: outgoing
  original: Тебе вообще плевать на меня. Ты третий раз за месяц отменяешь наш вечер, сегодня — за час до кино!
  expected_tone: 3
  expected_delivery: adapted
  meaning:
    facts: [Игорь третий раз за месяц отменил совместный вечер, Сегодня отменил за час до кино, Анне обидно]
    request: Не отменять совместные планы, проводить время вместе
  must_keep: [третий раз, вечер, кино]
  must_not_contain: [плевать]
  forbidden_distortions: [change_facts, drop_request, add_promise, add_apology]
expected:
  strategy: find_need_prepare_message
  draft: required
  draft_must_not_contain: [плевать]
  agent_should:
    - Сначала отразить чувство Анны, затем уточнить, что именно задело
    - "Предложить текст вида «Мне грустно, когда наши планы отменяются. Мне важно проводить с тобой время»"
    - Оставить Анне право править текст и решение нажать «Отправить»
    - На стороне Игоря — передать адаптацию с пометкой «адаптировано», оригинал по запросу, подсказать, как ответить
  agent_must_not:
    - Отправлять что-либо без явного «Отправить»
    - Терять в адаптации факты (третий раз, за час до кино) или просьбу
    - Добавлять от имени Анны обещания или извинения
